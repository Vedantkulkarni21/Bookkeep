<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>BookKeepPro | Admin Login</title>

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: #f5f5f5;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }

    .header {
      background: #BEE2FA;
      padding: clamp(14px, 3vw, 22px);
    }

    .header img {
      width: clamp(160px, 40vw, 240px);
      cursor: pointer;
    }

    /* 🔹 same button style as user page */
    .btn-admin {
      padding: 10px 16px;
      background: #FF7F11;
      color: #fff;
      border-radius: 25px;
      border: none;
      font-weight: 600;
      cursor: pointer;
      float: right;
    }

    .btn-admin:hover { background:#e56e0d; }

    .container {
      max-width: 480px;
      margin: 50px auto;
      background: #fff;
      padding: 50px;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.1);
      text-align: center;
      flex: 1;
    }

    .container h2 {
      color:#333;
      margin-bottom:30px;
      font-size:24px;
    }

    input {
      width:100%;
      padding:14px;
      margin-bottom:14px;
      border:1px solid #ddd;
      border-radius:8px;
      font-size:15px;
    }

    input:focus {
      outline:none;
      border-color:#FF7F11;
      box-shadow:0 0 5px rgba(255,127,17,0.3);
    }

    .button-group { display:flex; gap:12px; margin-top:25px; }

    .button {
      flex:1;
      padding:14px;
      border:none;
      border-radius:8px;
      font-size:16px;
      font-weight:600;
      cursor:pointer;
      transition:all .3s;
    }

    /* 🔹 same primary button style */
    .btn-user {
      background:#FF7F11;
      color:#fff;
    }

    .btn-user:hover {
      background:#e76e00;
      transform:translateY(-2px);
      box-shadow:0 4px 12px rgba(255,127,17,0.3);
    }

    .footer {
      margin-top:auto;
      background:#BEE2FA;
      padding:25px 20px;
      text-align:center;
    }

    .footer img { width:180px; margin-bottom:10px; }
    .footer small { color:#555; font-size:13px; }
  </style>
</head>

<body>

  <div class="header">
    <img
      src="/images/bookkeeppro-logo.webp"
      onclick="window.location.href='/home'"
      alt="BookKeepPro"
    />

    <!-- 🔹 same style — just changes link target -->
    <button class="btn-admin" onclick="window.location.href='/login'">
      USER LOGIN
    </button>
  </div>

  <div class="container">
    <h2>ADMIN LOGIN</h2>

    <input id="email" type="email" placeholder="Admin Email" required />
    <input id="password" type="password" placeholder="Password" required />

    <div class="button-group">
      <button class="button btn-user" onclick="loginAdmin()">
        ADMIN LOGIN
      </button>
    </div>
  </div>

  <div class="footer">
    <img src="/images/bookkeeppro-logo.webp" alt="logo">
    <br>
    <small>Copyright © 2024 Bookkeepro Business Solutions.</small>
  </div>

<script>
async function loginAdmin() {
  const email = document.getElementById("email").value.trim();
  const password = document.getElementById("password").value;

  if (!email || !password)
    return alert("Enter email and password");

  const res = await fetch("/api/auth/login", {
    method:"POST",
    headers:{ "Content-Type":"application/json" },
    body:JSON.stringify({ email, password })
  });

  const data = await res.json();

  if (!res.ok)
    return alert(data.detail || "Login failed");

  if (data.role !== "admin")
    return alert("This account is not an admin");

  localStorage.setItem("token", data.access_token);
  localStorage.setItem("role", data.role);
  localStorage.setItem("user_id", data.user_id);

  window.location.href = "/admin-dashboard";
}
</script>

</body>
</html>
