<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Upload Personal Documents - BookKeepro</title>

    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: "Poppins", sans-serif;
      }

      body {
        background: #f5f5f5;
        color: #222;
      }

      .header {
        background: #BEE2FA;
        width: 100%;
        padding: 18px 30px;
        display: flex;
        align-items: center;
      }

      #logo {
        height: 60px;
        cursor: pointer;
      }

      .container {
        max-width: 1000px;
        margin: 90px auto 60px;
        background: #fff;
        padding: 28px;
        border-radius: 12px;
        box-shadow: 0 6px 20px rgba(0, 0, 0, 0.06);
      }

      .page-title {
        display: flex;
        justify-content: space-between;
        margin-bottom: 18px;
      }

      .page-title h2 {
        font-size: 20px;
        color: #0077c8;
      }

      .helper {
        font-size: 14px;
        color: #666;
      }

      .upload-list {
        display: flex;
        flex-direction: column;
        gap: 12px;
        margin-top: 18px;
      }

      .upload-item {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 12px;
        border-radius: 10px;
        border: 1px solid #e6eef6;
        background: #fbfdff;
      }

      .doc-name {
        font-weight: 600;
      }

      .status {
        font-size: 13px;
        color: #666;
      }

      .upload-actions {
        display: flex;
        gap: 10px;
        align-items: center;
      }

      .upload-label {
        padding: 8px 12px;
        border-radius: 8px;
        background: #0077c8;
        color: #fff;
        cursor: pointer;
      }

      .delete-btn {
        padding: 8px 10px;
        border-radius: 8px;
        background: #fff;
        color: #ff6b6b;
        border: 1px solid #ffd0d0;
        display: none;
        cursor: pointer;
      }

      .footer {
        margin-top: 40px;
        background: #bee2fa;
        padding: 30px 0;
        text-align: center;
        font-size: 14px;
        color: #444;
      }
    </style>
  </head>

  <body>
    <!-- HEADER -->
    <div class="header">
      <img
        id="logo"
        src="/images/bookkeeppro-logo.png"
        onclick="window.location.href='/home'"
        alt="BookKeepro"
      />
    </div>

    <!-- MAIN -->
    <main class="container">
      <div class="page-title">
        <div>
          <h2>Upload Personal Documents</h2>
          <div class="helper">
            Upload required personal documents. Files are stored securely.
          </div>
        </div>
        <div class="helper">Allowed: PDF, JPG, PNG · Max 10MB</div>
      </div>

      <div id="docWrapper" class="upload-list"></div>

      <div style="margin-top: 20px">
        <button onclick="window.location.href='/dashboard'">
          ← Back to Dashboard
        </button>
      </div>
    </main>

    <!-- FOOTER -->
    <div class="footer">
      © 2024 BookKeepro Business Solutions. All rights reserved.
    </div>

    <!-- AUTH GUARD -->
    <script>
      const token = localStorage.getItem("token");
      const role = localStorage.getItem("role");

      if (!token || role?.toLowerCase() !== "user") {
        window.location.href = "/login";
      }
    </script>

    <!-- UPLOAD LOGIC -->
    <script>
      (function () {
        const docs = [
          "Government ID Proof",
          "Address Proof",
          "PAN Card",
          "Aadhaar Card",
          "Bank Statement",
          "Passport Size Photograph",
        ];

        const wrapper = document.getElementById("docWrapper");
        let uploadedFiles = {};

        function render() {
          wrapper.innerHTML = "";
          docs.forEach((doc, i) => {
            const div = document.createElement("div");
            div.className = "upload-item";
            div.innerHTML = `
              <div>
                <div class="doc-name">${i + 1}. ${doc}</div>
                <div id="status${i}" class="status"></div>
              </div>
              <div class="upload-actions">
                <label class="upload-label" for="file${i}">Choose file</label>
                <input id="file${i}" type="file" hidden />
                <button id="delete${i}" class="delete-btn">Delete</button>
              </div>
            `;
            wrapper.appendChild(div);

            document
              .getElementById("file" + i)
              .addEventListener("change", () => upload(i));
            document
              .getElementById("delete" + i)
              .addEventListener("click", () => remove(i));
          });
        }

        async function upload(i) {
          const file = document.getElementById("file" + i).files[0];
          if (!file) return;

          document.getElementById("status" + i).textContent = "Uploading...";
          const fd = new FormData();
          fd.append("file", file);

          const token = localStorage.getItem("token");

          const res = await fetch("/api/upload/personal-document", {
            method: "POST",
            body: fd,
            headers: { Authorization: "Bearer " + token },
          });

          const data = await res.json();

          if (!res.ok) {
            alert(data.detail || "Upload failed");
            return;
          }

          uploadedFiles[i] = data.file_id;
          document.getElementById("status" + i).textContent = "Uploaded ✓";
          document.getElementById("delete" + i).style.display = "inline-block";
        }

        async function remove(i) {
          if (!uploadedFiles[i]) return;

          const token = localStorage.getItem("token");

          await fetch(
            "/api/upload/personal-document/" + uploadedFiles[i],
            {
              method: "DELETE",
              headers: { Authorization: "Bearer " + token },
            }
          );

          document.getElementById("status" + i).textContent = "Deleted";
          document.getElementById("delete" + i).style.display = "none";
          delete uploadedFiles[i];
        }

        render();
      })();
    </script>
  </body>
</html>
