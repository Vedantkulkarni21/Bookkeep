<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>BookKeepPro | Admin Panel</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>

<style>
:root {
  --primary: #2D5A6B;
  --primary-dark: #1f3f4f;
  --bg: #f1f7fb;
  --card: #ffffff;
  --muted: #6b7a86;
}

/* RESET */
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  font-family: "Poppins", sans-serif;
}

html {
  font-size: clamp(14px, 1vw, 16px);
}

body {
  background: var(--bg);
  color: #222;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
}

/* HEADER */
.header {
  background: #BEE2FA;
  padding: clamp(14px, 3vw, 22px);
  display: flex;
  align-items: center;
}

.header img {
  width: clamp(160px, 30vw, 220px);
  cursor: pointer;
}

/* MAIN CONTAINER */
.main {
  width: min(100%, 1200px);
  margin: clamp(20px, 4vw, 40px) auto;
  padding: clamp(18px, 4vw, 32px);
  background: var(--card);
  border-radius: 16px;
  box-shadow: 0 10px 30px rgba(0,0,0,0.06);
  flex: 1;
}

/* TITLE */
.title {
  text-align: center;
  margin-bottom: 24px;
}

.title h1 {
  font-size: clamp(18px, 2.5vw, 24px);
  color: #0b2540;
  font-weight: 600;
}

.subtitle {
  font-size: clamp(13px, 2vw, 15px);
  color: var(--muted);
  margin-top: 6px;
}

/* USERS GRID */
.users {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
  gap: 18px;
  margin-top: 22px;
}

/* USER CARD */
.user-card {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 14px;
  padding: 16px;
  border-radius: 14px;
  border: 1px solid #e6edf3;
  background: #fbfdff;
  transition: transform 0.2s ease, box-shadow 0.2s ease;
}

.user-card:hover {
  transform: translateY(-3px);
  box-shadow: 0 8px 20px rgba(0,0,0,0.08);
}

/* LEFT */
.user-left {
  display: flex;
  align-items: center;
  gap: 12px;
  min-width: 0;
}

.avatar {
  width: clamp(44px, 6vw, 56px);
  height: clamp(44px, 6vw, 56px);
  border-radius: 50%;
  background: #e9f3fb;
  display: flex;
  align-items: center;
  justify-content: center;
  font-weight: 700;
  font-size: clamp(14px, 2vw, 18px);
  color: #0b2540;
  flex-shrink: 0;
}

.user-info {
  min-width: 0;
}

.user-info .name {
  font-weight: 600;
  color: #0b2540;
  font-size: clamp(14px, 2vw, 15px);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.user-info .meta {
  font-size: clamp(12px, 1.8vw, 13px);
  color: var(--muted);
}

/* BUTTON */
.btn-view {
  background: var(--primary);
  color: #fff;
  padding: 10px 16px;
  border-radius: 12px;
  font-size: clamp(12px, 1.8vw, 13px);
  text-decoration: none;
  transition: background 0.2s ease;
  flex-shrink: 0;
}

.btn-view:hover {
  background: var(--primary-dark);
}

/* EMPTY */
.empty {
  padding: 50px 20px;
  text-align: center;
  color: var(--muted);
  font-size: 14px;
  grid-column: 1 / -1;
}

/* FOOTER */
.footer {
  background: #BEE2FA;
  padding: clamp(16px, 4vw, 24px);
  text-align: center;
}

.footer img {
  width: clamp(120px, 25vw, 160px);
}

.footer small {
  display: block;
  margin-top: 8px;
  color: #555;
  font-size: clamp(11px, 1.8vw, 13px);
}

/* MOBILE OPTIMIZATION */
@media (max-width: 480px) {
  .user-card {
    flex-direction: column;
    align-items: flex-start;
  }

  .btn-view {
    width: 100%;
    text-align: center;
    margin-top: 10px;
  }
}
</style>
</head>

<body>

<!-- HEADER -->
<div class="header">
  <img src="/images/bookkeeppro-logo.png" alt="logo"
       onclick="location.href='/home'">
</div>

<!-- MAIN -->
<div class="main">
  <div class="title">
    <h1>Admin Dashboard</h1>
    <div class="subtitle">Manage users and review document submissions</div>
  </div>

  <div id="users" class="users">
    <div class="empty">Loading users...</div>
  </div>
</div>

<!-- FOOTER -->
<div class="footer">
  <img src="/images/bookkeeppro-logo.png" alt="logo">
  <small>© 2024 BookKeepro Business Solutions. All rights reserved.</small>
</div>

<script src="/js/admin.js"></script>

</body>
</html>
