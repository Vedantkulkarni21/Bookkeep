<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>BookKeepPro | Admin Panel</title>

  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: "Poppins", sans-serif;
    }

    body {
      background: #f1f7fb;
      color: #222;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* HEADER */
    .header {
      background: #BEE2FA;
      padding: 18px 26px;
      display: flex;
      align-items: center;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }

    .header img {
      width: 220px;
      cursor: pointer;
    }

    /* MAIN */
    .main {
      max-width: 1000px;
      margin: 36px auto;
      padding: 26px;
      background: #fff;
      border-radius: 14px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.06);
      flex: 1;
    }

    .title {
      text-align: center;
      margin-bottom: 28px;
    }

    .title h1 {
      font-size: 22px;
      color: #0b2540;
      font-weight: 600;
    }

    .subtitle {
      font-size: 14px;
      color: #6b7a86;
      margin-top: 6px;
    }

    /* USERS GRID */
    .users {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 16px;
      margin-top: 20px;
    }

    .user-card {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 16px;
      border-radius: 14px;
      border: 1px solid #e6edf3;
      background: #fbfdff;
      transition: all 0.25s ease;
    }

    .user-card:hover {
      transform: translateY(-3px);
      box-shadow: 0 8px 20px rgba(0,0,0,0.08);
    }

    .user-left {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .avatar {
      width: 54px;
      height: 54px;
      border-radius: 50%;
      background: #e9f3fb;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 18px;
      color: #0b2540;
    }

    .user-info .name {
      font-weight: 600;
      color: #0b2540;
      font-size: 15px;
    }

    .user-info .meta {
      font-size: 13px;
      color: #6b7a86;
      margin-top: 2px;
    }

    .btn-view {
      background: #2D5A6B;
      color: #fff;
      padding: 8px 14px;
      border-radius: 10px;
      font-size: 13px;
      text-decoration: none;
      transition: background 0.2s ease;
      white-space: nowrap;
    }

    .btn-view:hover {
      background: #1f3f4f;
    }

    .empty {
      padding: 40px;
      text-align: center;
      color: #6b7a86;
      font-size: 14px;
      grid-column: 1 / -1;
    }

    /* FOOTER */
    .footer {
      background: #BEE2FA;
      padding: 22px;
      text-align: center;
    }

    .footer img {
      width: 160px;
    }

    .footer small {
      display: block;
      color: #555;
      margin-top: 8px;
      font-size: 13px;
    }

    @media (max-width: 600px) {
      .main {
        margin: 24px 14px;
        padding: 20px;
      }
    }
  </style>
</head>

<body>

  <!-- HEADER -->
  <div class="header">
    <img src="/images/bookkeeppro-logo.png" alt="logo"
         onclick="location.href='/home'">
  </div>

  <!-- MAIN -->
  <div class="main">
    <div class="title">
      <h1>Admin Dashboard</h1>
      <div class="subtitle">Manage users and review document submissions</div>
    </div>

    <div id="users" class="users">
      <div class="empty">Loading users...</div>
    </div>
  </div>

  <!-- FOOTER -->
  <div class="footer">
    <img src="/images/bookkeeppro-logo.png" alt="logo">
    <small>© 2024 BookKeepro Business Solutions. All rights reserved.</small>
  </div>

  <!-- ADMIN LOGIC -->
  <script src="/js/admin.js"></script>

</body>
</html>
