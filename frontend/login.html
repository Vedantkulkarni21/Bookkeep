<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>BookKeepPro | Login</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #f5f5f5; display: flex; flex-direction: column; min-height: 100vh; }
    .header { background: #BEE2FA; padding: 15px 20px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
    .header img { width: 240px; cursor: pointer; }
    .container { max-width: 480px; margin: 50px auto; background: #fff; padding: 50px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); text-align: center; flex: 1; }
    .container h2 { color: #333; margin-bottom: 30px; font-size: 24px; }
    .form-group { margin-bottom: 20px; }
    input { width: 100%; padding: 14px; margin-bottom: 14px; border: 1px solid #ddd; border-radius: 8px; font-size: 15px; }
    input:focus { outline: none; border-color: #FF7F11; box-shadow: 0 0 5px rgba(255, 127, 17, 0.3); }
    .button-group { display: flex; gap: 12px; margin-top: 25px; }
    .button { flex: 1; padding: 14px; border: none; border-radius: 8px; font-size: 16px; font-weight: 600; cursor: pointer; transition: all 0.3s; }
    .btn-user { background: #FF7F11; color: #fff; }
    .btn-user:hover { background: #e76e00; transform: translateY(-2px); box-shadow: 0 4px 12px rgba(255, 127, 17, 0.3); }
    .btn-admin { background: #2D5A6B; color: #fff; }
    .btn-admin:hover { background: #1f3f4f; transform: translateY(-2px); box-shadow: 0 4px 12px rgba(45, 90, 107, 0.3); }
    .signup-link { margin-top: 15px; font-size: 14px; }
    .signup-link a { color: #FF7F11; text-decoration: none; font-weight: 600; }
    .signup-link a:hover { text-decoration: underline; }
    .footer { margin-top: auto; background: #BEE2FA; padding: 25px 20px; text-align: center; }
    .footer img { width: 180px; margin-bottom: 10px; }
    .footer small { color: #555; font-size: 13px; }
  </style>
</head>
<body>
  <div class="header">
    <img src="/images/bookkeeppro-logo.png" alt="logo" onclick="window.location.href='/home'">
  </div>

  <div class="container">
    <h2>LOGIN TO YOUR ACCOUNT</h2>
    <form id="loginForm" autocomplete="off">
      <div class="form-group">
        <input id="email" type="email" placeholder="Email Address" required />
        <input id="password" type="password" placeholder="Password" required />
      </div>
      
      <div class="button-group">
        <button type="submit" class="button btn-user" id="userLoginBtn">LOGIN</button>
        <button type="submit" class="button btn-admin" id="adminLoginBtn">ADMIN LOGIN</button>
      </div>

      <div class="signup-link">
        Don't have an account? <a href="/signup">Sign Up</a>
      </div>
    </form>
  </div>

  <div class="footer">
    <img src="/images/bookkeeppro-logo.png" alt="logo">
    <br>
    <small>Copyright © 2024 Bookkeepro Business Solutions.</small>
  </div>

  <script src="/js/login.js"></script>
  <script>
    document.getElementById('userLoginBtn').onclick = function(e) {
      e.preventDefault();
      loginUser('user');
    };
    
    document.getElementById('adminLoginBtn').onclick = function(e) {
      e.preventDefault();
      loginUser('admin');
    };
  </script>
</body>
</html>
