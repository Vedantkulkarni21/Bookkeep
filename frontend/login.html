<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>BookKeepPro | Login</title>
  <style>
    body{font-family:Arial;background:#f5f5f5;margin:0;display:flex;flex-direction:column;min-height:100vh}
    .header{background:#BEE2FA;padding:12px 20px}
    .header img{width:240px;cursor:pointer}
    .container{max-width:420px;margin:40px auto;background:#fff;padding:60px;border-radius:14px;box-shadow:0 3px 12px rgba(0,0,0,0.1);text-align:center}
    input{width:100%;padding:14px;margin-bottom:14px;border:1px solid #ccc;border-radius:8px;box-sizing:border-box}
    .button{width:100%;padding:14px;background:#FF7F11;color:#fff;border:none;border-radius:25px;font-size:16px;cursor:pointer}
    .button:hover{background:#e76e00}
  </style>
</head>
<body>
  <div class="header">
    <img src="/images/bookkeeppro-logo.png" alt="logo" onclick="window.location.href='/home'">
  </div>

  <div class="container">
    <h2>LOGIN TO YOUR ACCOUNT</h2>
    <form id="loginForm" autocomplete="off">
      <input id="email" type="email" placeholder="Email Address" required />
      <input id="password" type="password" placeholder="Password" required />
      <div style="text-align:left;margin-bottom:8px">
        <label><input id="isAdmin" type="checkbox" /> Admin login</label>
      </div>
      <button type="submit" class="button">LOGIN</button>
      <div style="margin-top:10px">Don't have an account? <a href="/signup">Sign Up</a></div>
    </form>
  </div>

  <div style="margin-top:auto;background:#BEE2FA;padding:15px 20px;text-align:center">
    <img src="/images/bookkeeppro-logo.png" alt="logo" style="width:180px"><br>
    <small>Copyright © 2024 Bookkeepro Business Solutions.</small>
  </div>

  <script src="/js/login.js"></script>
  <script>
    document.getElementById('loginForm').onsubmit = async function(e) {
      e.preventDefault();
      await loginUser();
    };
  </script>
</body>
</html>
