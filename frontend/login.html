<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>BookKeepPro | Login</title>

  <style>
    body{
      font-family:Arial;
      background:#f5f5f5;
      margin:0;
      display:flex;
      flex-direction:column;
      min-height:100vh
    }

    .header{
      background:#BEE2FA;
      padding:12px 20px
    }

    .header img{
      width:240px;
      cursor:pointer
    }

    .container{
  max-width:520px;           /* bigger card */
  margin:50px auto;
  background:#fff;
  padding:70px;              /* more breathing room */
  border-radius:16px;
  box-shadow:0 4px 18px rgba(0,0,0,0.12);
  text-align:center
}

h2{
  margin-bottom:30px;
  font-size:26px;
}

.links{
  margin-top:18px;
  font-size:15.5px;   /* increased from ~14px */
  line-height:1.6;
}

.links a{
  font-weight:400;
}



    input{
      width:100%;
      padding:14px;
      margin-bottom:14px;
      border:1px solid #ccc;
      border-radius:8px;
      box-sizing:border-box
    }

    .button{
      width:100%;
      padding:14px;
      background:#FF7F11;
      color:#fff;
      border:none;
      border-radius:25px;
      font-size:16px;
      cursor:pointer
    }

    .button:hover{
      background:#e76e00
    }

    .password-wrapper{
      position:relative
    }

    .password-wrapper input{
      padding-right:70px
    }

    .password-toggle{
      position:absolute;
      right:12px;
      top:40%;
      transform:translateY(-50%);
      background:none;
      border:none;
      color:#0077c8;
      font-weight:600;
      cursor:pointer
    }

    .links{
      margin-top:12px;
      font-size:14px
    }

    .links a{
      text-decoration:none
    }

    .footer{
      margin-top:auto;
      background:#BEE2FA;
      padding:15px 20px;
      text-align:center
    }

    .footer img{
      width:180px
    }

    .footer small{
      font-size:13px
    }
  </style>
</head>

<body>

  <!-- HEADER -->
  <div class="header">
    <img
      src="/images/bookkeeppro-logo.webp"
      alt="logo"
      onclick="window.location.href='/home'"
    >
  </div>

  <!-- LOGIN CARD -->
  <div class="container">
    <h2>LOGIN TO YOUR ACCOUNT</h2>

    <input
      id="email"
      type="email"
      placeholder="Email Address"
      required
    />

    <div class="password-wrapper">
      <input
        id="password"
        type="password"
        placeholder="Password"
        required
      />
      <button
        type="button"
        class="password-toggle"
        id="toggleBtn"
        onclick="togglePassword()"
      >
        Show
      </button>
    </div>

    <button class="button" onclick="loginUser()">
      LOGIN
    </button>

    <div class="links">
      <div style="margin-top:10px">
        Don’t have an account? <a href="/signup">Sign Up</a>
      </div>
      <div style="margin-top:6px">
        <a href="/forgot-password">Forgot password?</a>
      </div>
    </div>
  </div>

  <!-- FOOTER -->
  <div class="footer">
    <img src="/images/bookkeeppro-logo.webp" alt="logo"><br>
    <small>Copyright © 2026 Bookkeepro Business Solutions.</small>
  </div>

  <!-- LOGIN SCRIPT (UNCHANGED) -->
  <script>
    async function loginUser() {
      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value;

      if (!email || !password)
        return alert("Enter email and password");

      const res = await fetch("/api/auth/login", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ email, password })
      });

      const data = await res.json();

      if (!res.ok)
        return alert(data.detail || "Login failed");

      if (data.role !== "user")
        return alert("Please login from Admin page for admin accounts");

      localStorage.setItem("token", data.access_token);
      localStorage.setItem("role", data.role);
      localStorage.setItem("user_id", data.user_id);

      window.location.href = "/dashboard";
    }

    function togglePassword() {
      const pwd = document.getElementById("password");
      const btn = document.getElementById("toggleBtn");

      if (pwd.type === "password") {
        pwd.type = "text";
        btn.textContent = "Hide";
      } else {
        pwd.type = "password";
        btn.textContent = "Show";
      }
    }
  </script>

</body>
</html>
