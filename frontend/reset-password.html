<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>BookKeepPro | Reset Password</title>

  <style>
    /* === SAME BASE STYLES AS LOGIN === */
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: #f5f5f5;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }

    .header {
      background: #BEE2FA;
      padding: clamp(14px, 3vw, 22px);
    }

    .header img {
      width: clamp(160px, 40vw, 240px);
      cursor: pointer;
    }

    .password-wrapper {
  position: relative;
}

.password-wrapper input {
  padding-right: 44px; /* space for eye icon */
}

.toggle-password {
  position: absolute;
  right: 14px;
  top: 40%;
  transform: translateY(-50%);
  cursor: pointer;
  font-size: 18px;
  color: #888;
  user-select: none;
}

.toggle-password:hover {
  color: #333;
}

    .container {
      max-width: 480px;
      margin: 50px auto;
      background: #fff;
      padding: 50px;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.1);
      text-align: center;
      flex: 1;
    }

    .container h2 {
      color: #333;
      margin-bottom: 20px;
      font-size: 24px;
    }

    .container p {
      color: #666;
      font-size: 14px;
      margin-bottom: 25px;
    }

    input {
      width: 100%;
      padding: 14px;
      margin-bottom: 14px;
      border: 1px solid #ddd;
      border-radius: 8px;
      font-size: 15px;
    }

    .button-group {
      display: flex;
      gap: 12px;
      margin-top: 25px;
    }

    .button {
      flex: 1;
      padding: 14px;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: .3s;
      background: #FF7F11;
      color: #fff;
    }

    .button:hover {
      background: #e76e00;
    }

    .footer {
      margin-top: auto;
      background: #BEE2FA;
      padding: 25px 20px;
      text-align: center;
    }

    .footer img {
      width: 180px;
    }
  </style>
</head>

<body>

  <!-- HEADER -->
  <div class="header">
    <img src="/images/bookkeeppro-logo.webp" onclick="window.location.href='/home'">
  </div>

  <!-- MAIN CARD -->
  <div class="container">
    <h2>RESET YOUR PASSWORD</h2>
    <p>Enter your new password below to regain access to your account.</p>

    <!-- <input id="password" type="password" placeholder="New Password" /> -->
    <div class="password-wrapper">
      <input id="password" type="password" placeholder="New Password" />
      <span class="toggle-password" onclick="togglePassword()">
        👁
      </span>
    </div>


    <div class="button-group">
      <button class="button" onclick="resetPassword()">
        RESET PASSWORD
      </button>
    </div>
  </div>

  <!-- FOOTER -->
  <div class="footer">
    <img src="/images/bookkeeppro-logo.webp">
    <br>
    <small>Copyright © 2026 BookKeepro Business Solutions.</small>
  </div>

<script>
const params = new URLSearchParams(window.location.search);
const token = params.get("token");

async function resetPassword() {
  const new_password = document.getElementById("password").value;

  if (!new_password) {
    alert("Please enter a new password");
    return;
  }

  const res = await fetch("/api/auth/reset-password", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ token, new_password })
  });

  const data = await res.json();

  if (!res.ok) {
    alert(data.detail || "Password reset failed");
    return;
  }

  alert("Password reset successful. Please login.");
  window.location.href = "/login";
}
</script>

<script>
function togglePassword() {
  const input = document.getElementById("password");
  input.type = input.type === "password" ? "text" : "password";
}
</script>


</body>
</html>
