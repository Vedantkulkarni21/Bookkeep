<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>BookKeepPro | Admin Panel</title>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: Segoe UI, system-ui,sans-serif;
      background: #f1f7fb;
      color: #222;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    .header {
      background: #BEE2FA;
      padding: 18px 22px;
    }

    .header img { width: 220px; }

    .main {
      max-width: 1000px;
      margin: 30px auto;
      background: #fff;
      padding: 24px;
      border-radius: 12px;
      box-shadow: 0 6px 20px rgba(0,0,0,0.08);
      flex: 1;
    }

    .admin-title {
      text-align: center;
      font-size: 22px;
      margin: 20px 0 30px;
    }

    .blue { color: #0077C8; }
    .orange { color: #FF7F11; }

    .top-info-row {
      display: flex;
      gap: 20px;
      margin-bottom: 30px;
    }

    .info-card {
      flex: 2;
      border: 1px solid #ccc;
      border-radius: 12px;
      padding: 16px;
      background: #f9fcff;
    }

    .status-card {
      flex: 1;
      border: 1px solid #8ed66f;
      background: #eaffdd;
      border-radius: 12px;
      text-align: center;
      padding: 20px;
    }

    .status-card h3 {
      font-size: 26px;
      margin-top: 10px;
    }

    .approval-panel {
      display: flex;
      border: 1px solid #aaa;
      border-radius: 12px;
      overflow: hidden;
    }

    .doc-table-box { flex: 3; }

    .doc-table {
      width: 100%;
      border-collapse: collapse;
    }

    .doc-table th,
    .doc-table td {
      padding: 14px;
      border-bottom: 1px solid #ddd;
    }

    .doc-table th { background: #f5f7fa; }

    .view-btn {
      background: #2da9ff;
      color: #fff;
      border: none;
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 12px;
      cursor: pointer;
      margin-left: 10px;
    }

    .timeline-box {
      flex: 1;
      border-left: 1px solid #aaa;
      padding: 20px;
      text-align: center;
    }

    .timeline-control {
      display: flex;
      justify-content: center;
      gap: 14px;
      margin: 20px 0;
    }

    .timeline-control button {
      padding: 6px 12px;
      border-radius: 6px;
      cursor: pointer;
    }

    .approve-filing-btn {
      background: #2da9ff;
      color: #fff;
      border: none;
      padding: 10px 18px;
      border-radius: 20px;
      cursor: pointer;
    }

    .footer {
      background: #BEE2FA;
      padding: 20px;
      text-align: center;
    }

    .footer img { width: 160px; }
  </style>
</head>

<body>

  <div class="header">
    <img src="/images/bookkeeppro-logo.png" alt="BookKeepPro">
  </div>

  <div class="main">

    <button onclick="goBack()">← Back to Users</button>

    <h2 class="admin-title">
      WELCOME TO <span class="blue">BOOK</span><span class="orange">KEEPRO</span> ADMIN PANEL
    </h2>

    <div class="top-info-row">
      <div class="info-card">
        <p><b>User Name:</b> <span id="detailName">—</span></p>
        <p><b>Role Type:</b> <span id="detailRole">—</span></p>
        <p><b>E-mail ID:</b> <span id="detailEmail">—</span></p>
      </div>

      <div class="status-card">
        <p>Document Upload Status</p>
        <h3 id="uploadStatus">0/0</h3>
      </div>
    </div>

    <div class="approval-panel">

      <div class="doc-table-box">
        <table class="doc-table">
          <thead>
            <tr>
              <th>Document Approval Status</th>
              <th>Approve</th>
              <th>Reject</th>
            </tr>
          </thead>
          <tbody id="docTable"></tbody>
        </table>
      </div>

      <div class="timeline-box">
        <p><b>Approval & Timeline</b></p>

        <div class="timeline-control">
          <button onclick="decrementTimeline()">-</button>
          <span id="timelineValue">0</span>
          <button onclick="incrementTimeline()">+</button>
        </div>

        <button class="approve-filing-btn" onclick="approveForFiling()">
          Approve for filing
        </button>
      </div>

    </div>
  </div>

  <div class="footer">
    <img src="/images/bookkeeppro-logo.png">
    <small>© 2024 Bookkeepro Business Solutions</small>
  </div>

// ...existing code...

<script>
const params = new URLSearchParams(window.location.search);
const userId = params.get("user_id");
const token = localStorage.getItem("token");
const role = localStorage.getItem("role");

if (!token || role !== "admin") {
  localStorage.clear();
  window.location.href = "/login";
}

if (!userId) {
  alert("No user selected");
  window.location.href = "/admin-dashboard";
}

let refreshInterval = null;

async function loadUserDetails() {
  try {
    const res = await fetch(`/api/auth/admin/users/${userId}/documents`, {
      headers: { "Authorization": "Bearer " + token }
    });

    if (res.status === 401 || res.status === 403) {
      localStorage.clear();
      window.location.href = "/login";
      return;
    }

    const data = await res.json();
    const user = data.user || {};
    const docs = data.documents || [];

    document.getElementById("detailName").textContent = user.name || "—";
    document.getElementById("detailRole").textContent = user.role || "—";
    document.getElementById("detailEmail").textContent = user.email || "—";
    document.getElementById("uploadStatus").textContent =
      docs.length ? `${docs.length} uploaded` : "0 uploaded";

    const tbody = document.getElementById("docTable");

    if (docs.length === 0) {
      tbody.innerHTML =
        '<tr><td colspan="3" style="text-align:center;color:#6b7a86">No documents uploaded</td></tr>';
      return;
    }

    tbody.innerHTML = "";
    docs.forEach((d, i) => {
      const tr = document.createElement("tr");
      tr.innerHTML = `
        <td>${i + 1}. ${d.filename}
          <button class="view-btn">View</button>
        </td>
        <td><input type="checkbox" class="approve"></td>
        <td><input type="checkbox" class="reject"></td>
      `;

      const approve = tr.querySelector(".approve");
      const reject = tr.querySelector(".reject");

      approve.addEventListener("change", () => {
        if (approve.checked) reject.checked = false;
      });

      reject.addEventListener("change", () => {
        if (reject.checked) approve.checked = false;
      });

      tr.querySelector(".view-btn").addEventListener("click", () => {
        window.open(
          `https://drive.google.com/file/d/${d.drive_file_id}/view`,
          "_blank"
        );
      });

      tbody.appendChild(tr);
    });
  } catch (err) {
    console.error("Error loading user details", err);
  }
}

document.addEventListener("DOMContentLoaded", () => {
  loadUserDetails();
  refreshInterval = setInterval(loadUserDetails, 5000);
});

window.addEventListener("beforeunload", () => {
  if (refreshInterval) clearInterval(refreshInterval);
});

let timeline = 0;
function incrementTimeline() {
  timeline++;
  document.getElementById("timelineValue").textContent = timeline;
}
function decrementTimeline() {
  if (timeline > 0) timeline--;
  document.getElementById("timelineValue").textContent = timeline;
}
function approveForFiling() {
  alert(`Approved for filing\nTimeline: ${timeline} days\nUser ID: ${userId}`);
}
function goBack() {
  window.location.href = "/admin-dashboard";
}
</script>

</body>
</html>
