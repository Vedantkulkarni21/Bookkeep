<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>BookKeepPro | Admin Panel</title>

    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      html {
        font-size: clamp(14px, 1vw, 16px);
      }
      body {
        font-family:
          Segoe UI,
          system-ui,
          sans-serif;
        background: #f1f7fb;
        color: #222;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
      }
      .header {
        background: #bee2fa;
        padding: clamp(14px, 3vw, 22px);
      }
      .header img {
        width: clamp(160px, 40vw, 240px);
        cursor: pointer;
      }
      .logout-btn {
        padding: 10px 16px;
        background: #ff7f11;
        color: #fff;
        border-radius: 25px;
        border: none;
        font-weight: 600;
        cursor: pointer;
        float: right;
      }
      .logout-btn:hover {
        background: #e56e0d;
      }
      .main {
        width: min(100%, 1100px);
        margin: clamp(16px, 4vw, 30px) auto;
        background: #fff;
        padding: clamp(16px, 4vw, 26px);
        border-radius: 14px;
        box-shadow: 0 6px 20px rgba(0, 0, 0, 0.08);
        flex: 1;
      }
      .admin-title {
        text-align: center;
        font-size: clamp(18px, 2.5vw, 22px);
        margin: 20px 0 28px;
      }
      .blue {
        color: #0077c8;
      }
      .orange {
        color: #ff7f11;
      }
      .main > button {
        margin-bottom: 14px;
        padding: 8px 14px;
        border-radius: 8px;
        border: none;
        cursor: pointer;
      }
      .top-info-row {
        display: flex;
        gap: 20px;
        margin-bottom: 26px;
      }
      .info-card,
      .status-card {
        border-radius: 14px;
        padding: 16px;
      }
      .info-card {
        flex: 2;
        border: 1px solid #ccc;
        background: #f9fcff;
      }
      .info-card p {
        margin-bottom: 8px;
        font-size: clamp(13px, 1.8vw, 15px);
      }
      .status-card {
        flex: 1;
        border: 1px solid #8ed66f;
        background: #eaffdd;
        text-align: center;
      }
      .status-card h3 {
        font-size: clamp(22px, 4vw, 26px);
        margin-top: 10px;
      }
      .approval-panel {
        display: flex;
        border: 1px solid #aaa;
        border-radius: 14px;
        overflow: hidden;
      }
      .doc-table-box {
        flex: 3;
        overflow-x: auto;
      }
      .doc-table {
        width: 100%;
        min-width: 520px;
        border-collapse: collapse;
      }
      .doc-table th,
      .doc-table td {
        padding: 14px;
        border-bottom: 1px solid #ddd;
        font-size: clamp(13px, 1.8vw, 15px);
      }
      .doc-table th {
        background: #f5f7fa;
      }
      .view-btn {
        background: #2da9ff;
        color: #fff;
        border: none;
        padding: 6px 14px;
        border-radius: 20px;
        font-size: 12px;
        cursor: pointer;
        margin-left: 10px;
      }
      .view-btn:active {
        transform: translateY(1px) scale(0.94);
        box-shadow: 0 2px 6px rgba(0, 0, 0, 0.12);
      }
      .timeline-box {
        flex: 1;
        border-left: 1px solid #aaa;
        padding: 20px;
        text-align: center;
      }
      .timeline-control {
        display: flex;
        justify-content: center;
        gap: 14px;
        margin: 20px 0;
      }
      .timeline-control button {
        padding: 6px 14px;
        border-radius: 8px;
        cursor: pointer;
      }
      .approve-filing-btn {
        background: #2da9ff;
        color: #fff;
        border: none;
        padding: 12px 18px;
        border-radius: 20px;
        cursor: pointer;
        width: 100%;
      }
      .approve-filing-btn:active {
        transform: translateY(1px) scale(0.96);
        box-shadow: 0 2px 6px rgba(0, 0, 0, 0.12);
      }
      .footer {
        background: #bee2fa;
        padding: clamp(16px, 4vw, 22px);
        text-align: center;
      }
      .footer img {
        width: clamp(120px, 30vw, 160px);
      }
      @media (max-width: 768px) {
        .top-info-row {
          flex-direction: column;
        }
        .approval-panel {
          flex-direction: column;
        }
        .timeline-box {
          border-left: none;
          border-top: 1px solid #aaa;
        }
      }

      .panel-item {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 14px;
        border-radius: 12px;
        border: 1px solid #e6eef6;
        background: #fff;
        margin-bottom: 12px;
      }

      .panel-left {
        display: flex;
        flex-direction: column;
        gap: 6px;
      }

      .panel-actions {
        display: flex;
        gap: 10px;
        align-items: center;
      }
      .container {
        width: min(100%, 1100px);
        margin: 0 auto;
      }

      .upload-list {
        display: flex;
        flex-direction: column;
      }

      .upload-label {
        padding: 8px 12px;
        border-radius: 8px;
        background: #0077c8;
        color: #fff;
        cursor: pointer;
        border: none;
      }

      .delete-btn {
        padding: 6px 10px;
        border-radius: 8px;
        background: #fff;
        color: #ff6b6b;
        border: 1px solid #ffd0d0;
        cursor: pointer;
      }

      .small-muted {
        font-size: 13px;
        color: #777;
      }
    </style>
  </head>

      async function submitDocumentsForReview() {
        if (!confirm("Submit all uploaded documents for user review?")) return;

        const res = await fetch("/api/review/submit", {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            Authorization: "Bearer " + window.AUTH_TOKEN,
          },
          body: JSON.stringify({
            user_id: userId,
          }),
        });

        if (!res.ok) {
          alert("❌ Failed to submit documents. Please try again.");
          return;
        }

        const data = await res.json();

        if (data.email_sent) {
          alert(
            "✅ Documents submitted successfully.\n📧 Email sent to the user.",
          );
        } else {
          alert(
            "⚠️ Documents submitted, but email could NOT be sent.\n" +
              "Please notify the user manually or retry later.",
          );
        }
      }
    </script>

async function loadUserDetails() {
  reviewState = JSON.parse(localStorage.getItem(REVIEW_KEY) || "{}");

  const res = await fetch(
    `/api/upload/admin/users/${userId}/documents`,
    { headers: { Authorization: "Bearer " + token } }
  );

  if (!res.ok) {
    alert("Failed to load user documents");
    return;
  }

  const { user = {}, documents = [] } = await res.json();

  /* ===== USER INFO ===== */
  detailName.textContent = user.name || "—";
  detailRole.textContent = user.role || "—";
  detailEmail.textContent = user.email || "—";

  /* ===== RESET UI ===== */
  docTable.innerHTML = "";
  engagementBox.style.display = "none";

  const personalDocs = [];

  /* ===== FILTER PERSONAL DOCS ===== */
  documents.forEach((d) => {
    if (d.doc_type?.toLowerCase().includes("engagement")) {
      engagementBox.style.display = "flex";
      engagementViewBtn.onclick = () =>
        window.open(
          `https://drive.google.com/file/d/${d.drive_file_id}/view`,
          "_blank"
        );
      return;
    }

    if (d.table === "personal") personalDocs.push(d);
  });

  uploadStatus.textContent = `${personalDocs.length} user docs`;

  /* ===== EMPTY STATE ===== */
  if (!personalDocs.length) {
    docTable.innerHTML = `
      <tr>
        <td colspan="3" style="text-align:center;color:#6b7a86">
          No personal documents uploaded
        </td>
      </tr>`;
    return;
  }

  /* ===== RENDER PERSONAL DOCS ===== */
  personalDocs.forEach((d, i) => {
    const state = reviewState[d.drive_file_id] || {};

    const tr = document.createElement("tr");
    tr.innerHTML = `
      <td>
        ${i + 1}. ${d.filename}
        <div class="small-muted">${d.doc_type || "Personal Document"}</div>
        <button class="view-btn">View</button>
      </td>
      <td><input type="checkbox" class="approve"></td>
      <td><input type="checkbox" class="reject"></td>
    `;

    const approve = tr.querySelector(".approve");
    const reject = tr.querySelector(".reject");

    approve.checked = state.status === "approved";
    reject.checked = state.status === "rejected";

    approve.onchange = () =>
      updateState(d.drive_file_id, approve, reject, "approved", d.filename);

    reject.onchange = () =>
      updateState(d.drive_file_id, reject, approve, "rejected", d.filename);

    tr.querySelector(".view-btn").onclick = () =>
      window.open(
        `https://drive.google.com/file/d/${d.drive_file_id}/view`,
        "_blank"
      );

    docTable.appendChild(tr);
  });
}


function renderDocTable(tbody, docs, icon) {
  if (!docs.length) {
    tbody.innerHTML = `
      <tr>
        <td colspan="3" style="text-align:center;color:#6b7a86">
          No documents uploaded
        </td>
      </tr>`;
    return;
  }

  docs.forEach((d, i) => {
    const state = reviewState[d.drive_file_id] || {};

    const tr = document.createElement("tr");
    tr.innerHTML = `
      <td>
        ${i + 1}. ${d.filename}
        <div class="small-muted">${icon} ${d.doc_type || ""}</div>
        <button class="view-btn">View</button>
      </td>
      <td><input type="checkbox" class="approve"></td>
      <td><input type="checkbox" class="reject"></td>
    `;

    const approve = tr.querySelector(".approve");
    const reject = tr.querySelector(".reject");

    approve.checked = state.status === "approved";
    reject.checked = state.status === "rejected";

    approve.onchange = () =>
      updateState(d.drive_file_id, approve, reject, "approved", d.filename);

    reject.onchange = () =>
      updateState(d.drive_file_id, reject, approve, "rejected", d.filename);

    tr.querySelector(".view-btn").onclick = () =>
      window.open(
        `https://drive.google.com/file/d/${d.drive_file_id}/view`,
        "_blank"
      );

    tbody.appendChild(tr);
  });
}


function renderRow(d, index, tableEl) {
  const state = reviewState[d.drive_file_id] || null;

  const tr = document.createElement("tr");
  tr.innerHTML = `
    <td>
      ${index + 1}. ${d.filename}
      <div class="small-muted">${d.doc_type || "Document"}</div>
      <button class="view-btn">View</button>
    </td>
    <td><input type="checkbox" class="approve"></td>
    <td><input type="checkbox" class="reject"></td>
  `;

  const approve = tr.querySelector(".approve");
  const reject = tr.querySelector(".reject");

  approve.checked = state?.status === "approved";
  reject.checked = state?.status === "rejected";

  approve.onchange = () =>
    updateState(
      d.drive_file_id,
      approve,
      reject,
      "approved",
      d.filename
    );

  reject.onchange = () =>
    updateState(
      d.drive_file_id,
      reject,
      approve,
      "rejected",
      d.filename
    );

  tr.querySelector(".view-btn").onclick = () =>
    window.open(
      `https://drive.google.com/file/d/${d.drive_file_id}/view`,
      "_blank"
    );

  tableEl.appendChild(tr);
}


      function updateState(fileId, active, other, value, name) {
        if (active.checked) {
          other.checked = false;
          reviewState[fileId] = { status: value, name };
        } else {
          delete reviewState[fileId];
        }
        localStorage.setItem(REVIEW_KEY, JSON.stringify(reviewState));
      }

      /* ================= NAV ================= */
      window.goBack = () => (window.location.href = "/admin-dashboard");

    <script>
      async function approveForFiling() {
        if (!confirm("Send approval email to user?")) return;

        const approved = [];
        const rejected = [];

        Object.values(reviewState).forEach((item) => {
          if (item.status === "approved") approved.push(item.name);
          if (item.status === "rejected") rejected.push(item.name);
        });

        if (!approved.length && !rejected.length) {
          alert("Please approve or reject at least one document.");
          return;
        }

        const res = await fetch("/api/review/notify-user", {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            Authorization: "Bearer " + window.AUTH_TOKEN,
          },
          body: JSON.stringify({
            user_id: userId,
            approved,
            rejected,
            timeline,
          }),
        });

        if (!res.ok) {
          alert("Failed to send approval email. Please try again.");
          return;
        }

        localStorage.removeItem(`docReviewState_${userId}`);
        reviewState = {};

        alert("Approval email sent successfully.");
      }
    </script>

      }

      async function deleteAdminDoc(fileId) {
        if (!confirm("Delete this document?")) return;

        const res = await fetch(`/api/upload/admin-document/${fileId}`, {
          method: "DELETE",
          headers: { Authorization: "Bearer " + token },
        });

        if (!res.ok) {
          alert("Delete failed");
          return;
        }

        loadAdminDocs();
      }

      async function loadPanelDocs() {
        const res = await fetch("/api/admin/documents", {
          headers: { Authorization: "Bearer " + token },
        });

        if (!res.ok) return;

        const docs = await res.json();

        docs.forEach((f) => {
          const index = PANEL_DOCS.findIndex((d) => d.doc_key === f.doc_key);
          if (index === -1) return;

          panelFiles[index] = f.drive_file_id;
          panelStatus(index, "Uploaded ✓");
          showPanelButtons(index, true);
        });
      }

      /* ================= VIEW / DELETE ================= */
      function viewPanelDoc(i) {
        const id = panelFiles[i];
        if (id)
          window.open(`https://drive.google.com/file/d/${id}/view`, "_blank");
      }

      async function deletePanelDoc(i) {
        if (!confirm("Delete this document?")) return;

        const id = panelFiles[i];
        if (!id) return;

        const res = await fetch(`/api/upload/admin-document/${id}`, {
          method: "DELETE",
          headers: { Authorization: "Bearer " + token },
        });

        if (!res.ok) {
          alert("Delete failed");
          return;
        }

        delete panelFiles[i];
        panelStatus(i, "Not uploaded");
        showPanelButtons(i, false);
        document.getElementById(`panelFile${i}`).value = "";
      }

      /* ================= HELPERS ================= */
      function panelStatus(i, text) {
        document.getElementById(`panelStatus${i}`).textContent = text;
      }

      function showPanelButtons(i, show) {
        document.getElementById(`panelView${i}`).style.display = show
          ? "inline-block"
          : "none";
        document.getElementById(`panelDelete${i}`).style.display = show
          ? "inline-block"
          : "none";
      }

      window.addEventListener("beforeunload", () => {
        if (refresh) clearInterval(refresh);
      });

      document.getElementById("adminDocInput").onchange = async (e) => {
        const file = e.target.files[0];
        if (!file) return;

        const fd = new FormData();
        fd.append("file", file);
        fd.append("doc_key", file.name.toLowerCase().replace(/\s+/g, "_"));
        fd.append("doc_label", file.name);

        const res = await fetch("/api/upload/admin-documents", {
          method: "POST",
          headers: { Authorization: "Bearer " + token },
          body: fd,
        });

        if (!res.ok) {
          alert("Upload failed");
          return;
        }

        e.target.value = "";
        loadAdminDocs();
      };

      async function loadAdminDocs() {
        const res = await fetch("/api/upload/admin-documents", {
          headers: { Authorization: "Bearer " + token },
        });

        if (!res.ok) return;

        const docs = await res.json();
        docPanel.innerHTML = "";

        docs.forEach((doc) => {
          const div = document.createElement("div");
          div.className = "panel-item";

          div.innerHTML = `
      <div class="panel-left">
        <b>${doc.doc_label}</b>
        <span class="small-muted">${doc.filename}</span>
      </div>
      <div class="panel-actions">
        <button class="view-btn">View</button>
        <button class="delete-btn">Delete</button>
      </div>
    `;

          div.querySelector(".view-btn").onclick = () =>
            window.open(
              `https://drive.google.com/file/d/${doc.drive_file_id}/view`,
              "_blank",
            );

          div.querySelector(".delete-btn").onclick = () =>
            deleteAdminDoc(doc.id);

          docPanel.appendChild(div);
        });
      }

      async function deleteAdminDoc(id) {
        if (!confirm("Delete this admin document?")) return;

        const res = await fetch(`/api/upload/admin-documents/${id}`, {
          method: "DELETE",
          headers: { Authorization: "Bearer " + token },
        });

        if (!res.ok) {
          alert("Delete failed");
          return;
        }

        loadAdminDocs();
      }
    </script>
  </body>
</html>
