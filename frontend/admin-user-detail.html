<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>BookKeepPro | Admin Panel</title>

  <style>
*{box-sizing:border-box;margin:0;padding:0}
html{font-size:clamp(14px,1vw,16px)}
body{
  font-family:Segoe UI,system-ui,sans-serif;
  background:#f1f7fb;color:#222;
  min-height:100vh;display:flex;flex-direction:column
}
.header{background:#BEE2FA;padding:clamp(14px,3vw,22px)}
.header img{width:clamp(160px,40vw,240px);cursor:pointer}
.logout-btn{
  padding:10px 16px;background:#FF7F11;color:#fff;
  border-radius:25px;border:none;font-weight:600;cursor:pointer;float:right
}
.logout-btn:hover{background:#e56e0d}
.main{
  width:min(100%,1100px);margin:clamp(16px,4vw,30px) auto;
  background:#fff;padding:clamp(16px,4vw,26px);
  border-radius:14px;box-shadow:0 6px 20px rgba(0,0,0,.08);flex:1
}
.admin-title{text-align:center;font-size:clamp(18px,2.5vw,22px);margin:20px 0 28px}
.blue{color:#0077C8}.orange{color:#FF7F11}
.main>button{margin-bottom:14px;padding:8px 14px;border-radius:8px;border:none;cursor:pointer}
.top-info-row{display:flex;gap:20px;margin-bottom:26px}
.info-card,.status-card{border-radius:14px;padding:16px}
.info-card{flex:2;border:1px solid #ccc;background:#f9fcff}
.info-card p{margin-bottom:8px;font-size:clamp(13px,1.8vw,15px)}
.status-card{flex:1;border:1px solid #8ed66f;background:#eaffdd;text-align:center}
.status-card h3{font-size:clamp(22px,4vw,26px);margin-top:10px}
.approval-panel{display:flex;border:1px solid #aaa;border-radius:14px;overflow:hidden}
.doc-table-box{flex:3;overflow-x:auto}
.doc-table{width:100%;min-width:520px;border-collapse:collapse}
.doc-table th,.doc-table td{padding:14px;border-bottom:1px solid #ddd;font-size:clamp(13px,1.8vw,15px)}
.doc-table th{background:#f5f7fa}
.view-btn{
  background:#2da9ff;color:#fff;border:none;
  padding:6px 14px;border-radius:20px;font-size:12px;cursor:pointer;margin-left:10px
}
.timeline-box{flex:1;border-left:1px solid #aaa;padding:20px;text-align:center}
.timeline-control{display:flex;justify-content:center;gap:14px;margin:20px 0}
.timeline-control button{padding:6px 14px;border-radius:8px;cursor:pointer}
.approve-filing-btn{
  background:#2da9ff;color:#fff;border:none;
  padding:12px 18px;border-radius:20px;cursor:pointer;width:100%
}
.footer{background:#BEE2FA;padding:clamp(16px,4vw,22px);text-align:center}
.footer img{width:clamp(120px,30vw,160px)}
@media(max-width:768px){
  .top-info-row{flex-direction:column}
  .approval-panel{flex-direction:column}
  .timeline-box{border-left:none;border-top:1px solid #aaa}
}
  </style>
</head>

<body>

<div class="header">
  <img src="/images/bookkeeppro-logo.webp" onclick="window.location.href='/home'" />
  <button class="logout-btn" onclick="logoutUser()">Logout</button>
</div>

<div class="main">

  <button onclick="goBack()">← Back to Users</button>

  <h2 class="admin-title">
    WELCOME TO <span class="blue">BOOK</span><span class="orange">KEEPRO</span> ADMIN PANEL
  </h2>

  <div class="top-info-row">
    <div class="info-card">
      <p><b>User Name:</b> <span id="detailName">—</span></p>
      <p><b>Role Type:</b> <span id="detailRole">—</span></p>
      <p><b>E-mail ID:</b> <span id="detailEmail">—</span></p>
    </div>

    <div class="status-card">
      <p>Document Upload Status</p>
      <h3 id="uploadStatus">0/0</h3>
    </div>
  </div>

  <div class="approval-panel">

    <div class="doc-table-box">
      <table class="doc-table">
        <thead>
        <tr>
          <th>Document Approval Status</th>
          <th>Approve</th>
          <th>Reject</th>
        </tr>
        </thead>
        <tbody id="docTable"></tbody>
      </table>
    </div>

    <div class="timeline-box">
      <p><b>Approval & Timeline</b></p>

      <div class="timeline-control">
        <button onclick="decrementTimeline()">-</button>
        <span id="timelineValue">0</span>
        <button onclick="incrementTimeline()">+</button>
      </div>

      <button class="approve-filing-btn" onclick="approveForFiling()">
        Approve for filing
      </button>
    </div>

  </div>
</div>

<div class="footer">
  <img src="/images/bookkeeppro-logo.webp">
  <small>© 2024 Bookkeepro Business Solutions</small>
</div>


<!-- ========= SCRIPT (SCOPED + PERSISTENT) ========= -->
<script>
(() => {

const params = new URLSearchParams(window.location.search);
const userId = params.get("user_id");
const token = localStorage.getItem("token");
const role = localStorage.getItem("role");

if (!token || role !== "admin") {
  localStorage.clear();
  window.location.href = "/login";
}

if (!userId) {
  alert("No user selected");
  window.location.href = "/admin-dashboard";
}

/* 🟢 In-page persistent review state */
let docReviewState = {};   // { filename: "approved" | "rejected" }

let timeline = 0;
function incrementTimeline(){ timeline++; document.getElementById("timelineValue").textContent = timeline; }
function decrementTimeline(){ if(timeline>0) timeline--; document.getElementById("timelineValue").textContent = timeline; }
window.incrementTimeline = incrementTimeline;
window.decrementTimeline = decrementTimeline;


async function loadUserDetails() {

  const res = await fetch(`/api/auth/admin/users/${userId}/documents`, {
    headers:{ Authorization:"Bearer "+token }
  });

  if(res.status === 401 || res.status === 403){
    localStorage.clear();
    window.location.href = "/login";
    return;
  }

  const data = await res.json();
  const user = data.user || {};
  const docs = data.documents || [];

  document.getElementById("detailName").textContent = user.name || "—";
  document.getElementById("detailRole").textContent = user.role || "—";
  document.getElementById("detailEmail").textContent = user.email || "—";
  document.getElementById("uploadStatus").textContent =
      `${docs.length} uploaded`;

  const tbody = document.getElementById("docTable");
  tbody.innerHTML = "";

  if (!docs.length){
    tbody.innerHTML =
      `<tr><td colspan="3" style="text-align:center;color:#6b7a86">
         No documents uploaded
       </td></tr>`;
    return;
  }

  docs.forEach((d,i)=>{
    const filename = d.filename;

    // restore saved state if exists
    const savedState = docReviewState[filename] || null;

    const tr = document.createElement("tr");
    tr.innerHTML = `
      <td>${i+1}. ${filename}
        <button class="view-btn">View</button>
      </td>

      <td><input type="checkbox" class="approve"></td>
      <td><input type="checkbox" class="reject"></td>
    `;

    const approve = tr.querySelector(".approve");
    const reject  = tr.querySelector(".reject");

    // apply persisted selection
    if(savedState === "approved") approve.checked = true;
    if(savedState === "rejected") reject.checked = true;

    approve.addEventListener("change",()=>{
      if(approve.checked){
        reject.checked = false;
        docReviewState[filename] = "approved";
      } else delete docReviewState[filename];
    });

    reject.addEventListener("change",()=>{
      if(reject.checked){
        approve.checked = false;
        docReviewState[filename] = "rejected";
      } else delete docReviewState[filename];
    });

    tr.querySelector(".view-btn").addEventListener("click",()=>{
      window.open(`https://drive.google.com/file/d/${d.drive_file_id}/view`,`_blank`);
    });

    tbody.appendChild(tr);
  });
}


/* 🟢 Send review mail when button pressed */
async function approveForFiling(){

  const approved = [];
  const rejected = [];

  Object.entries(docReviewState).forEach(([name,status])=>{
    if(status === "approved") approved.push(name);
    if(status === "rejected") rejected.push(name);
  });

  const payload = {
    user_id: userId,
    approved,
    rejected,
    timeline
  };

  const res = await fetch("/api/review/notify-user",{
    method:"POST",
    headers:{
      "Content-Type":"application/json",
      Authorization:"Bearer "+token
    },
    body:JSON.stringify(payload)
  });

  if(res.ok){
    alert("Review email sent to user successfully");
  } else {
    alert("Failed to send email");
  }
}

window.approveForFiling = approveForFiling;


/* auto refresh — but keeps selections */
let refreshInterval = null;

document.addEventListener("DOMContentLoaded",()=>{
  loadUserDetails();
  refreshInterval = setInterval(loadUserDetails, 5000);
});

window.addEventListener("beforeunload",()=>{
  if(refreshInterval) clearInterval(refreshInterval);
});


function goBack(){ window.location.href="/admin-dashboard"; }
function logoutUser(){
  localStorage.removeItem("token");
  localStorage.removeItem("role");
  localStorage.removeItem("checklistDownloaded");
  window.location.href="/login";
}

window.goBack = goBack;
window.logoutUser = logoutUser;

})();
</script>

</body>
</html>
