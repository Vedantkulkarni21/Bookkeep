<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>BookKeepPro | Forgot Password</title>

  <style>
    /* === SAME BASE STYLES AS LOGIN === */
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: #f5f5f5;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }

    .header {
      background: #BEE2FA;
      padding: clamp(14px, 3vw, 22px);
    }

    .header img {
      width: clamp(160px, 40vw, 240px);
      cursor: pointer;
    }

    .container {
      max-width: 480px;
      margin: 50px auto;
      background: #fff;
      padding: 50px;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.1);
      text-align: center;
      flex: 1;
    }

    .container h2 {
      color: #333;
      margin-bottom: 15px;
      font-size: 24px;
    }

    .container p {
      color: #666;
      font-size: 14px;
      margin-bottom: 25px;
    }

    input {
      width: 100%;
      padding: 14px;
      margin-bottom: 14px;
      border: 1px solid #ddd;
      border-radius: 8px;
      font-size: 15px;
    }

    .button-group {
      display: flex;
      gap: 12px;
      margin-top: 25px;
    }

    .button {
      flex: 1;
      padding: 14px;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: .3s;
      background: #FF7F11;
      color: #fff;
    }

    .button:hover {
      background: #e76e00;
    }

    .footer {
      margin-top: auto;
      background: #BEE2FA;
      padding: 25px 20px;
      text-align: center;
    }

    .footer img {
      width: 180px;
    }

    .back-link {
      margin-top: 15px;
      font-size: 14px;
    }
  </style>
</head>

<body>

  <!-- HEADER -->
  <div class="header">
    <img src="/images/bookkeeppro-logo.webp" onclick="window.location.href='/home'">
  </div>

  <!-- MAIN CARD -->
  <div class="container">
    <h2>FORGOT PASSWORD</h2>
    <p>Enter your registered email address to receive a password reset link.</p>

    <input id="email" type="email" placeholder="Email Address" />

    <div class="button-group">
      <button class="button" onclick="sendReset()">
        SEND RESET LINK
      </button>
    </div>

    <div class="back-link">
      <a href="/login">Back to Login</a>
    </div>
  </div>

  <!-- FOOTER -->
  <div class="footer">
    <img src="/images/bookkeeppro-logo.webp">
    <br>
    <small>Copyright © 2026 BookKeepro Business Solutions.</small>
  </div>

<script>
async function sendReset() {
  const email = document.getElementById("email").value.trim();
  if (!email) {
    alert("Please enter your email address");
    return;
  }

  await fetch("/api/auth/forgot-password", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ email })
  });

  alert("If the email exists, a reset link has been sent.");
}
</script>

</body>
</html>
