<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Dashboard – BookKeepPro</title>

  <link
    href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
    rel="stylesheet"
  />

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: "Poppins", sans-serif;
    }

    body {
      background: #f5f5f5;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    .header {
      background: #BEE2FA;
      padding: 18px 30px;
    }

    .header img {
      width: 240px;
      cursor: pointer;
    }

    .container {
      max-width: 900px;
      margin: 50px auto;
      background: #fff;
      padding: 36px;
      border-radius: 14px;
      box-shadow: 0 6px 24px rgba(0, 0, 0, 0.06);
    }

    h2 {
      color: #0b2540;
      margin-bottom: 8px;
    }

    .subtitle {
      color: #6b7a86;
      font-size: 14px;
      margin-bottom: 24px;
    }

    /* Download box */
    .download-box {
      background: #f3f8fc;
      border: 1px solid #dceaf5;
      padding: 20px;
      border-radius: 12px;
      margin-bottom: 30px;
      text-align: center;
    }

    .download-box p {
      margin-bottom: 14px;
      color: #333;
      font-size: 14px;
    }

    .download-btn {
      padding: 12px 18px;
      border-radius: 10px;
      background: #0077c8;
      color: #fff;
      border: none;
      cursor: pointer;
      font-weight: 600;
    }

    .actions {
      display: flex;
      gap: 20px;
      justify-content: center;
      margin-top: 20px;
    }

    .action-btn {
      min-width: 240px;
      padding: 16px;
      border-radius: 14px;
      border: none;
      font-size: 15px;
      font-weight: 600;
      cursor: not-allowed;
      opacity: 0.5;
    }

    .action-btn.enabled {
      cursor: pointer;
      opacity: 1;
    }

    .personal {
      background: #0077c8;
      color: white;
    }

    .business {
      background: #2D5A6B;
      color: white;
    }

    .footer {
      margin-top: auto;
      background: #BEE2FA;
      padding: 18px;
      text-align: center;
      font-size: 14px;
      color: #444;
    }
  </style>
</head>

<body>

  <!-- Header -->
  <div class="header">
    <img
      src="/images/bookkeeppro-logo.png"
      onclick="window.location.href='/home'"
      alt="BookKeepPro"
    />
  </div>

  <!-- Main -->
  <div class="container">
    <h2>Welcome to BookKeepPro</h2>
    <div class="subtitle">
      Please download the document checklist before proceeding.
    </div>

    <!-- Download Section -->
    <div class="download-box">
      <p>
        Download the document checklist and guidelines.  
        You must review this before uploading documents.
      </p>

      <a
        href="./images/individual_taxpayer_organizer_2024.pdf"
        download
        onclick="markDownloaded()"
      >
        <button class="download-btn">
          Download Checklist
        </button>
      </a>
    </div>

    <!-- Actions -->
    <div class="actions">
      <button
        id="personalBtn"
        class="action-btn personal"
        onclick="goPersonal()"
        disabled
      >
        Personal Documents
      </button>

      <button
        id="businessBtn"
        class="action-btn business"
        onclick="goBusiness()"
        disabled
      >
        Business Documents
      </button>
    </div>
  </div>

  <!-- Footer -->
  <div class="footer">
    © 2024 BookKeepro Business Solutions. All rights reserved.
  </div>

  <!-- Logic -->
  <script>
    // Auth guard
    const token = localStorage.getItem("token");
    const role = localStorage.getItem("role");

    if (!token || role?.toLowerCase() !== "user") {
      window.location.href = "/login";
    }

    const personalBtn = document.getElementById("personalBtn");
    const businessBtn = document.getElementById("businessBtn");

    // Enable buttons if already downloaded in this session
    if (sessionStorage.getItem("checklistDownloaded") === "true") {
      enableButtons();
    }

    function markDownloaded() {
      sessionStorage.setItem("checklistDownloaded", "true");
      setTimeout(enableButtons, 500); // slight delay feels natural
    }

    function enableButtons() {
      personalBtn.disabled = false;
      businessBtn.disabled = false;

      personalBtn.classList.add("enabled");
      businessBtn.classList.add("enabled");
    }

    function goPersonal() {
      window.location.href = "/upload-personal";
    }

    function goBusiness() {
      window.location.href = "/upload-business";
    }
  </script>

</body>
</html>
