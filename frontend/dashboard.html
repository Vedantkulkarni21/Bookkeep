<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Dashboard – BookKeepPro</title>

  <link
    href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
    rel="stylesheet"
  />

  <style>
    * {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  font-family: "Poppins", sans-serif;
}

html {
  font-size: clamp(14px, 1vw, 16px);
}

body {
  background: #f5f5f5;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
}

/* HEADER */
.header {
  background: #BEE2FA;
  padding: clamp(14px, 3vw, 22px);
}

.header img {
  width: clamp(160px, 40vw, 240px);
  cursor: pointer;
}

/* LOGOUT BUTTON */
.logout-btn {
  padding: 10px 16px;
  background: #FF7F11;
  color: #fff;
  border-radius: 25px;
  border: none;
  font-weight: 600;
  cursor: pointer;
  float: right;
}

.logout-btn:hover {
  background: #e56e0d;
}

/* MAIN CONTAINER */
.container {
  width: min(100%, 900px);
  margin: clamp(24px, 5vw, 50px) auto;
  background: #fff;
  padding: clamp(20px, 5vw, 36px);
  border-radius: 16px;
  box-shadow: 0 6px 24px rgba(0, 0, 0, 0.06);
}

/* HEADINGS */
h2 {
  color: #0b2540;
  margin-bottom: 8px;
  font-size: clamp(18px, 2.5vw, 22px);
}

.subtitle {
  color: #6b7a86;
  font-size: clamp(13px, 1.8vw, 14px);
  margin-bottom: 24px;
}

/* DOWNLOAD BOX */
.download-box {
  background: #f3f8fc;
  border: 1px solid #dceaf5;
  padding: clamp(16px, 4vw, 22px);
  border-radius: 14px;
  margin-bottom: 30px;
  text-align: center;
}

.download-box p {
  margin-bottom: 14px;
  color: #333;
  font-size: clamp(13px, 1.8vw, 14px);
}

.download-btn {
  padding: 12px 20px;
  border-radius: 12px;
  background: #FF7F11;
  color: #fff;
  border: none;
  cursor: pointer;
  font-weight: 600;
  font-size: clamp(13px, 1.8vw, 14px);
}

/* ACTION BUTTONS */
.actions {
  display: flex;
  gap: 20px;
  justify-content: center;
  margin-top: 20px;
  /* flex-wrap: wrap; */
}

.action-btn {
  width: min(100%, 280px);
  padding: 16px;
  border-radius: 16px;
  border: none;
  font-size: clamp(14px, 2vw, 15px);
  font-weight: 600;
  cursor: not-allowed;
  opacity: 0.5;
}

.action-btn.enabled {
  cursor: pointer;
  opacity: 1;
}

.personal {
  background: #0077c8;
  color: white;
}

.business {
  background: #2D5A6B;
  color: white;
}

/* FOOTER */
.footer {
  margin-top: auto;
  background: #BEE2FA;
  padding: clamp(14px, 3vw, 18px);
  text-align: center;
  font-size: clamp(12px, 1.8vw, 14px);
  color: #444;
}

/* MOBILE TWEAKS */
@media (max-width: 480px) {
  .actions {
    flex-direction: column;
    align-items: stretch;
  }

  .download-btn {
    width: 100%;
  }
}



.download-actions {
  display: flex;
  justify-content: center;
  gap: 12px;
  flex-wrap: wrap;
}

.upload-btn {
  padding: 12px 20px;
  border-radius: 12px;
  background: #0077c8;
  color: #fff;
  border: none;
  cursor: pointer;
  font-weight: 600;
}

.upload-btn input {
  display: none;
}

.file-actions {
  display: none;
  margin-top: 14px;
  justify-content: center;
  gap: 12px;
}

.file-actions button {
  padding: 10px 16px;
  border-radius: 10px;
  border: none;
  font-weight: 600;
  cursor: pointer;
}

.view-btn {
  background: #2D5A6B;
  color: white;
}

.delete-btn {
  background: #d9534f;
  color: white;
}

/* ===== ACTION ROW ===== */
.action-row {
  display: flex;
  gap: 14px;
  justify-content: center;
  align-items: center;
  flex-wrap: nowrap;        /* 🔥 force single row */
  white-space: nowrap;     /* 🔥 prevent wrapping */
  margin-top: 15px;
}


/* ===== PILL BUTTON BASE ===== */
.pill {
  padding: 10px 18px;
  border-radius: 999px;
  font-weight: 600;
  font-size: 14px;
  cursor: pointer;
  border: none;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  min-width: 90px;
  transition: all 0.2s ease;
  
}

.pill input {
  display: none;
}

/* ===== INDIVIDUAL STYLES ===== */
.download-pill {
  background: #3081d2;
  color: #ffffff;
  border: 1px solid #b6dcff;
}

.download-pill:hover {
  background: #d6ecff;
}

.upload-pill {
  background: #FF7F11;
  color: white;
}

.upload-pill:hover {
  background: #095fb4;
}

.view-pill {
  background: #2da9ff;
  color: white;
}

.view-pill:hover {
  background: #1b96ea;
}

.delete-pill {
  background: white;
  color: #e53935;
  border: 1px solid #f5b5b5;
}

.delete-pill:hover {
  background: #ffecec;
}



  </style>
</head>

<body>

  <!-- Header -->
  <div class="header">

    <img
      src="/images/bookkeeppro-logo.webp"
      onclick="window.location.href='/home'"
      alt="BookKeepPro"
    />

    <button class="logout-btn" onclick="logoutUser()">
      Logout
    </button>

  </div>


  <!-- Main -->
  <div class="container">
    <h2>Welcome to BookKeepPro</h2>
    <div class="subtitle">
      Please download the document before proceeding.
    </div>

    <!-- Download Section -->
    <!-- <div class="download-box">
  <p>
    Download the document checklist and guidelines.  
    You must review this before uploading documents.
  </p>

  <div class="download-center">
    <a
      href="./images/general_engagement_letter_2025-1 - common.pdf"

      onclick="markDownloaded()"

<div class="download-box">
  <p>
    Download the document checklist before proceeding.  
    You must review this before uploading documents.
  </p>

  <div class="action-row">
  <a href="./images/general_engagement_letter_2025-1 - common.pdf" download>
    <button class="pill download-pill">Download general engagement letter</button>
  </a>

  <label class="pill upload-pill">
    Upload
    <input type="file" accept=".pdf" onchange="handleUpload(event)" />
  </label>

  <button class="pill view-pill" id="viewBtn" onclick="viewFile()" style="display:none;">
    View
  </button>

  <button class="pill delete-pill" id="deleteBtn" onclick="deleteFile()" style="display:none;">
    Delete
  </button>
</div>

</div>



    <!-- Actions -->
    <div class="actions">
      <button
        id="personalBtn"
        class="action-btn personal"
        onclick="goPersonal()"
        disabled
      >
        Personal Documents
      </button>

      <button
        id="businessBtn"
        class="action-btn business"
        onclick="goBusiness()"
        disabled
      >
        Business Documents
      </button>
    </div>
  </div>

  <!-- Footer -->
  <div class="footer">
    © 2026 BookKeepro Business Solutions. All rights reserved.
  </div>

<script>
/* ================= AUTH GUARD ================= */
const token = localStorage.getItem("token");
const role = localStorage.getItem("role");

if (!token || role?.toLowerCase() !== "user") {
  window.location.href = "/login";
}

const personalBtn = document.getElementById("personalBtn");
const businessBtn = document.getElementById("businessBtn");
// const fileActions = document.getElementById("fileActions");

let engagementFileId = null;

/* ================= NAV ================= */
function goPersonal() {
  window.location.href = "/upload-personal";
}

function goBusiness() {
  window.location.href = "/upload-business";
}

function logoutUser() {
  localStorage.clear();
  window.location.href = "/login";
}

/* ================= UPLOAD ================= */
async function handleUpload(event) {
  const file = event.target.files[0];
  if (!file) return;

  const fd = new FormData();
  fd.append("file", file);
  fd.append("doc_type", "EngagementLetter");

  const res = await fetch("/api/upload/personal-document", {
    method: "POST",
    headers: {
      Authorization: "Bearer " + token,
    },
    body: fd,
  });

  if (!res.ok) {
    const text = await res.text();
    alert("Upload failed:\n" + text);
    console.error("Upload error:", text);
    return;
  }

  const data = await res.json();
  engagementFileId = data.file_id;

  document.getElementById("viewBtn").style.display = "inline-flex";
document.getElementById("deleteBtn").style.display = "inline-flex";

  enableDashboard();
}

/* ================= RESTORE STATE ================= */
async function restoreEngagementLetter() {
  const res = await fetch("/api/upload/engagement-letter/status", {
    headers: {
      Authorization: "Bearer " + token,
    },
  });

  if (!res.ok) return;

  const data = await res.json();
  // if (data.uploaded) {
  //   engagementFileId = data.file_id;
  //   fileActions.style.display = "flex";
  //   enableDashboard();
  // }
  if (data.uploaded) {
  engagementFileId = data.file_id;

  document.getElementById("viewBtn").style.display = "inline-flex";
  document.getElementById("deleteBtn").style.display = "inline-flex";

  enableDashboard();
}

}

restoreEngagementLetter();

/* ================= UI ================= */
function enableDashboard() {
  personalBtn.disabled = false;
  businessBtn.disabled = false;
  personalBtn.classList.add("enabled");
  businessBtn.classList.add("enabled");
}

function viewFile() {
  if (!engagementFileId) return;
  window.open(
    `https://drive.google.com/file/d/${engagementFileId}/view`,
    "_blank"
  );
}

async function deleteFile() {
  document.getElementById("viewBtn").style.display = "none";
document.getElementById("deleteBtn").style.display = "none";

  if (!engagementFileId) return;

  const confirmed = confirm("Delete this document permanently?");
  if (!confirmed) return;

  const res = await fetch(
    `/api/upload/personal-document/${engagementFileId}`,
    {
      method: "DELETE",
      headers: {
        Authorization: "Bearer " + token,
      },
    }
  );

  if (!res.ok) {
    alert("Delete failed");
    return;
  }

  engagementFileId = null;
  // fileActions.style.display = "none";

  personalBtn.disabled = true;
  businessBtn.disabled = true;
  personalBtn.classList.remove("enabled");
  businessBtn.classList.remove("enabled");
}
</script>


</body>
</html>
