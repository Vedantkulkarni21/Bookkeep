<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Dashboard – BookKeepPro</title>

  <link
    href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
    rel="stylesheet"
  />

  <style>
    * {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  font-family: "Poppins", sans-serif;
}

html {
  font-size: clamp(14px, 1vw, 16px);
}

body {
  background: #f5f5f5;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
}

/* HEADER */
.header {
  background: #BEE2FA;
  padding: clamp(14px, 3vw, 22px);
}

.header img {
  width: clamp(160px, 40vw, 240px);
  cursor: pointer;
}

/* MAIN CONTAINER */
.container {
  width: min(100%, 900px);
  margin: clamp(24px, 5vw, 50px) auto;
  background: #fff;
  padding: clamp(20px, 5vw, 36px);
  border-radius: 16px;
  box-shadow: 0 6px 24px rgba(0, 0, 0, 0.06);
}

/* HEADINGS */
h2 {
  color: #0b2540;
  margin-bottom: 8px;
  font-size: clamp(18px, 2.5vw, 22px);
}

.subtitle {
  color: #6b7a86;
  font-size: clamp(13px, 1.8vw, 14px);
  margin-bottom: 24px;
}

/* DOWNLOAD BOX */
.download-box {
  background: #f3f8fc;
  border: 1px solid #dceaf5;
  padding: clamp(16px, 4vw, 22px);
  border-radius: 14px;
  margin-bottom: 30px;
  text-align: center;
}

.download-box p {
  margin-bottom: 14px;
  color: #333;
  font-size: clamp(13px, 1.8vw, 14px);
}

.download-btn {
  padding: 12px 20px;
  border-radius: 12px;
  background: #FF7F11;
  color: #fff;
  border: none;
  cursor: pointer;
  font-weight: 600;
  font-size: clamp(13px, 1.8vw, 14px);
}

/* ACTION BUTTONS */
.actions {
  display: flex;
  gap: 20px;
  justify-content: center;
  margin-top: 20px;
  flex-wrap: wrap;
}

.action-btn {
  width: min(100%, 280px);
  padding: 16px;
  border-radius: 16px;
  border: none;
  font-size: clamp(14px, 2vw, 15px);
  font-weight: 600;
  cursor: not-allowed;
  opacity: 0.5;
}

.action-btn.enabled {
  cursor: pointer;
  opacity: 1;
}

.personal {
  background: #0077c8;
  color: white;
}

.business {
  background: #2D5A6B;
  color: white;
}

/* FOOTER */
.footer {
  margin-top: auto;
  background: #BEE2FA;
  padding: clamp(14px, 3vw, 18px);
  text-align: center;
  font-size: clamp(12px, 1.8vw, 14px);
  color: #444;
}

/* MOBILE TWEAKS */
@media (max-width: 480px) {
  .actions {
    flex-direction: column;
    align-items: stretch;
  }

  .download-btn {
    width: 100%;
  }
}

  </style>
</head>

<body>

  <!-- Header -->
  <div class="header">
    <img
      src="/images/bookkeeppro-logo.png"
      onclick="window.location.href='/home'"
      alt="BookKeepPro"
    />
  </div>

  <!-- Main -->
  <div class="container">
    <h2>Welcome to BookKeepPro</h2>
    <div class="subtitle">
      Please download the document checklist before proceeding.
    </div>

    <!-- Download Section -->
    <div class="download-box">
      <p>
        Download the document checklist and guidelines.  
        You must review this before uploading documents.
      </p>

      <a
        href="./images/individual_taxpayer_organizer_2024.pdf"
        download
        onclick="markDownloaded()"
      >
        <button class="download-btn">
          Download Checklist
        </button>
      </a>
    </div>

    <!-- Actions -->
    <div class="actions">
      <button
        id="personalBtn"
        class="action-btn personal"
        onclick="goPersonal()"
        disabled
      >
        Personal Documents
      </button>

      <button
        id="businessBtn"
        class="action-btn business"
        onclick="goBusiness()"
        disabled
      >
        Business Documents
      </button>
    </div>
  </div>

  <!-- Footer -->
  <div class="footer">
    © 2024 BookKeepro Business Solutions. All rights reserved.
  </div>

  <!-- Logic -->
<script>
  /* ================= AUTH GUARD ================= */
  const token = localStorage.getItem("token");
  const role = localStorage.getItem("role");

  if (!token || role?.toLowerCase() !== "user") {
    window.location.href = "/login";
  }

  const personalBtn = document.getElementById("personalBtn");
  const businessBtn = document.getElementById("businessBtn");

  const CHECKLIST_KEY = "checklistDownloaded";

  /* ============== INITIAL STATE ================= */
  function updateButtons() {
    const downloaded = localStorage.getItem(CHECKLIST_KEY) === "true";

    personalBtn.disabled = !downloaded;
    businessBtn.disabled = !downloaded;

    personalBtn.classList.toggle("enabled", downloaded);
    businessBtn.classList.toggle("enabled", downloaded);
  }

  updateButtons();

  /* ============== DOWNLOAD HANDLER ============== */
  function markDownloaded() {
    localStorage.setItem(CHECKLIST_KEY, "true");

    // small UX delay so it feels intentional
    setTimeout(updateButtons, 300);
  }

  /* ============== NAVIGATION ==================== */
  function goPersonal() {
    if (personalBtn.disabled) return;
    window.location.href = "/upload-personal";
  }

  function goBusiness() {
    if (businessBtn.disabled) return;
    window.location.href = "/upload-business";
  }
</script>

</body>
</html>
