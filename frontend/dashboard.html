<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Dashboard – BookKeepPro</title>

  <link
    href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
    rel="stylesheet"
  />

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: "Poppins", sans-serif;
    }

    html {
      font-size: clamp(14px, 1vw, 16px);
    }

    body {
      background: #f5f5f5;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* HEADER */
    .header {
      background: #BEE2FA;
      padding: clamp(14px, 3vw, 22px);
    }

    .header img {
      width: clamp(160px, 40vw, 240px);
      cursor: pointer;
    }

    .logout-btn {
      padding: 10px 16px;
      background: #FF7F11;
      color: #fff;
      border-radius: 25px;
      border: none;
      font-weight: 600;
      cursor: pointer;
      float: right;
    }

    .logout-btn:hover {
      background: #e56e0d;
    }

    /* MAIN CONTAINER */
    .container {
      width: min(100%, 900px);
      margin: clamp(24px, 5vw, 50px) auto;
      margin-top: 90px;
      background: #fff;
      padding: clamp(20px, 5vw, 36px);
      border-radius: 16px;
      box-shadow: 0 6px 24px rgba(0, 0, 0, 0.06);
    }

    h2 {
      color: #0b2540;
      margin-bottom: 8px;
      font-size: clamp(18px, 2.5vw, 22px);
    }

    .subtitle {
      color: #6b7a86;
      font-size: clamp(13px, 1.8vw, 14px);
      margin-bottom: 24px;
    }

    /* DOWNLOAD BOX */
    .download-box {
      background: #f3f8fc;
      border: 1px solid #dceaf5;
      padding: clamp(16px, 4vw, 22px);
      border-radius: 14px;
      margin-bottom: 30px;
      text-align: center;
      margin: 30px auto;
      width: 70%;
    }

    .download-box p {
      margin-bottom: 16px;
      color: #333;
      font-size: clamp(13px, 1.8vw, 14px);
    }

    .admin-box {
      background: #f3f8fc;
      border: 1px solid #dceaf5;
      padding: clamp(16px, 4vw, 22px);
      border-radius: 14px;
      text-align: center;
      /* margin: 10px auto; */
      width: 70%;
    }

    .download-pill {
      padding: 12px 22px;
      border-radius: 999px;
      font-weight: 600;
      font-size: 14px;
      cursor: pointer;
      border: 1px solid #b6dcff;
      background: #3081d2;
      color: white;
      transition: background 0.2s ease;
    }

    .download-pill:hover {
      background: #256bb3;
    }

    /* ACTION BUTTONS (ALWAYS ACTIVE) */
    .actions {
      display: flex;
      gap: 20px;
      justify-content: center;
      margin-top: 20px;
    }

    .action-btn {
      width: min(100%, 280px);
      padding: 16px;
      border-radius: 16px;
      border: none;
      font-size: clamp(14px, 2vw, 15px);
      font-weight: 600;
      cursor: pointer;      /* ✅ FIXED */
      opacity: 1;           /* ✅ FIXED */
      transition: transform 0.15s ease, box-shadow 0.15s ease;
    }

    .action-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 16px rgba(0,0,0,0.12);
    }

    .personal {
      background: #0077c8;
      color: white;
    }

    .business {
      background: #2D5A6B;
      color: white;
    }

    /* FOOTER */
    .footer {
      margin-top: auto;
      background: #BEE2FA;
      padding: clamp(14px, 3vw, 18px);
      text-align: center;
      font-size: clamp(12px, 1.8vw, 14px);
      color: #444;
    }

    .approve-btn {
      padding: 8px 14px;
      background: #4CAF50;
      color: rgb(255, 255, 255);
      border: none;
      border-radius: 8px;
      cursor: pointer;
    }
    .reject-btn {
      padding: 8px 14px;
      background: #F44336;
      color: rgb(255, 255, 255);
      border: none;
      border-radius: 8px;
      cursor: pointer;
    }
    .submit-rejection-btn {
      padding: 8px 14px;
      background: #256bb3;
      color: rgb(255, 255, 255);
      border: none;
      border-radius: 8px;
      cursor: pointer;
    }

    @media (max-width: 480px) {
      .actions {
        flex-direction: column;
      }

      .download-pill {
        width: 100%;
      }
    }
  </style>
</head>

<body>

  <!-- Header -->
  <div class="header">
    <img
      src="/images/bookkeeppro-logo.webp"
      onclick="window.location.href='/home'"
      alt="BookKeepPro"
    />

    <button class="logout-btn" onclick="logoutUser()">
      Logout
    </button>
  </div>

  <!-- Main -->
  <div class="container">
    <h2>Welcome to BookKeepPro</h2>
    <div class="subtitle">
      Please download the document before proceeding.
    </div>

    <div class="download-box">
      <p>Download the General Engagement Letter before proceeding.</p>

      <a href="./images/general_engagement_letter_2025-1 - common.pdf" download>
        <button class="download-pill">
          Download General Engagement Letter
        </button>
      </a>
    </div>

    <div class="actions">
      <button class="action-btn personal" onclick="goPersonal()">
        Personal Documents
      </button>

      <button class="action-btn business" onclick="goBusiness()">
        Business Documents
      </button>
    </div>
  </div>

  
  <div
  id="adminDocsBox"
  class="admin-box"
  style="margin:10px auto;text-align:left; margin-bottom: 50px;"
>

  <p style="text-align:center;  padding-bottom:10px; font-weight:600; font-size:18px;">
    <b>Returns uploaded by Admin for Review</b>
  </p>

  <div id="adminDocsList"></div>
</div>


  <!-- Footer -->
  <div class="footer">
    © 2026 BookKeepro Business Solutions. All rights reserved.
  </div>

<script>
/* ================= AUTH + GLOBALS ================= */
const token = localStorage.getItem("token");
const role  = localStorage.getItem("role");

if (!token || role?.toLowerCase() !== "user") {
  localStorage.clear();
  window.location.href = "/login";
}

/* ================= NAV ================= */
function goPersonal() {
  window.location.href = "/upload-personal";
}

function goBusiness() {
  window.location.href = "/upload-business";
}

function logoutUser() {
  localStorage.clear();
  window.location.href = "/login";
}
</script>



<script>
console.log("SCRIPT LOADED");

async function loadAdminUploadedDocs() {
  console.log("loadAdminUploadedDocs() CALLED");

  console.log("token =", typeof token, token);

  const list = document.getElementById("adminDocsList");
  console.log("adminDocsList =", list);

  if (!list) {
    console.error("❌ adminDocsList element NOT FOUND");
    return;
  }

  let res;
  try {
    console.log("➡️ calling /api/upload/admin-documents");

    res = await fetch("/api/upload/admin-documents", {
      headers: {
        Authorization: "Bearer " + token
      }
    });

    console.log("⬅️ fetch returned, status =", res.status);

  } catch (e) {
    console.error("❌ FETCH FAILED:", e);
    list.innerHTML = "<small>Fetch failed</small>";
    return;
  }

  let documents;
  try {
    documents = await res.json();
    console.log("📦 RAW RESPONSE:", documents);
    console.log("📦 type:", typeof documents, "isArray:", Array.isArray(documents));
  } catch (e) {
    console.error("❌ JSON PARSE FAILED:", e);
    list.innerHTML = "<small>JSON parse failed</small>";
    return;
  }

  if (!Array.isArray(documents)) {
    console.error("❌ RESPONSE IS NOT ARRAY");
    list.innerHTML = "<small>Invalid response format</small>";
    return;
  }

  if (documents.length === 0) {
    console.warn("⚠️ documents array EMPTY");
    list.innerHTML = "<small>No documents uploaded by admin yet.</small>";
    return;
  }

  console.log("✅ RENDERING", documents.length, "DOCUMENTS");

  list.innerHTML = documents.map((d, i) => {
    console.log("➡️ render item", i, d);

    return `
  <div style="
    border:1px solid #dceaf5;
    border-radius:12px;
    padding:14px;
    margin-bottom:12px;
    background:#fff
  ">
    <div style="display:flex;justify-content:space-between;align-items:center;">
      <b>${d.doc_label}</b>

      <button
        class="download-pill"
        onclick="window.open(
          'https://drive.google.com/file/d/${d.drive_file_id}/view',
          '_blank'
        )">
        View
      </button>
    </div>

    <div style="margin-top:12px; display:flex; gap:10px;">
      <button class="approve-btn"
        onclick="approveAdminDoc(${d.id})">
        Approve
      </button>

      <button class="reject-btn"
        onclick="showRejectBox(${d.id})">
        Reject
      </button>
    </div>

    <!-- 🔴 REJECT BOX (THIS WAS MISSING) -->
    <div id="rejectBox_${d.id}" style="display:none;margin-top:12px;">
      <textarea
        id="rejectReason_${d.id}"
        placeholder="Kindly mention the reason for rejection"
        style="
          width:100%;
          padding:10px;
          border-radius:8px;
          border:1px solid #ccc;
          resize:vertical;
        "
      ></textarea>

      <button
        style="margin-top:8px" class="submit-rejection-btn"
        onclick="submitRejection(${d.id})">
        Submit Rejection
      </button>
    </div>
  </div>
`;

  }).join("");
}

document.addEventListener("DOMContentLoaded", () => {
  console.log("DOMContentLoaded fired");
  loadAdminUploadedDocs();
});
</script>

<script>
function showRejectBox(docId) {
  const box = document.getElementById(`rejectBox_${docId}`);
  if (box) box.style.display = "block";
}

async function approveAdminDoc(docId) {
  if (!confirm("Approve this document?")) return;

  const res = await fetch("/api/review/admin-doc-response", {
    method: "POST",
    headers: {
      "Content-Type": "application/json",
      Authorization: "Bearer " + token
    },
    body: JSON.stringify({
      doc_id: docId,
      status: "approved"
    })
  });

  if (!res.ok) {
    alert("❌ Failed to send approval");
    return;
  }

  alert("✅ Approval sent to admin");
}

async function submitRejection(docId) {
  const textarea = document.getElementById(`rejectReason_${docId}`);
  const reason = textarea?.value.trim();

  if (!reason) {
    alert("Please enter rejection reason");
    return;
  }

  const res = await fetch("/api/review/admin-doc-response", {
    method: "POST",
    headers: {
      "Content-Type": "application/json",
      Authorization: "Bearer " + token
    },
    body: JSON.stringify({
      doc_id: docId,
      status: "rejected",
      reason
    })
  });

  if (!res.ok) {
    alert("❌ Failed to send rejection");
    return;
  }

  alert("📩 Rejection sent to admin");
}
</script>


</body>
</html>
