<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>BookKeepPro | Signup</title>
  <style>
    body{font-family:Arial;background:#f5f5f5;margin:0;display:flex;flex-direction:column;min-height:100vh}
    .header{background:#BEE2FA;padding:12px 20px}
    .header img{width:240px;cursor:pointer}
    .container{max-width:420px;margin:40px auto;background:#fff;padding:60px;border-radius:14px;box-shadow:0 3px 12px rgba(0,0,0,0.1);text-align:center}
    input{width:100%;padding:14px;margin-bottom:14px;border:1px solid #ccc;border-radius:8px;box-sizing:border-box}
    .button{width:100%;padding:14px;background:#FF7F11;color:#fff;border:none;border-radius:25px;font-size:16px;cursor:pointer}
    .button:hover{background:#e76e00}
  </style>
</head>
<body>
  <div class="header">
    <img src="/images/bookkeeppro-logo.webp" alt="logo" onclick="window.location.href='/home'">
  </div>

  <div class="container">
    <h2>CREATE YOUR ACCOUNT</h2>
    <form id="signupForm" autocomplete="off">
      <input id="name" type="text" placeholder="Full Name" required />
      <input id="email" type="email" placeholder="Email Address" required />
      <input id="phone" type="tel" placeholder="Phone Number (Optional)" />
      <!-- <input id="password" type="password" placeholder="Password" required /> -->
      <div style="position:relative;">
  <input
    id="password"
    type="password"
    placeholder="Password"
    required
    style="padding-right:70px;"
  />
  <button
    type="button"
    onclick="togglePassword()"
    id="toggleBtn"
    style="
      position:absolute;
      right:12px;
      top:40%;
      transform:translateY(-50%);
      background:none;
      border:none;
      color:#0077c8;
      font-weight:600;
      cursor:pointer;
    "
  >
    Show
  </button>
</div>

      <button type="submit" class="button">SIGN UP</button>
      <div style="margin-top:10px">Already have an account? <a href="/login">Login</a></div>
    </form>
  </div>

  <div style="margin-top:auto;background:#BEE2FA;padding:15px 20px;text-align:center">
    <img src="/images/bookkeeppro-logo.webp" alt="logo" style="width:180px"><br>
    <small>Copyright © 2026 Bookkeepro Business Solutions.</small>
  </div>

  <script src="/js/signup.js"></script>
  <script>
    document.getElementById('signupForm').onsubmit = async function(e) {
      e.preventDefault();
      await signupUser();
    };
  </script>
  <script>
function togglePassword() {
  const pwd = document.getElementById("password");
  const btn = document.getElementById("toggleBtn");

  if (pwd.type === "password") {
    pwd.type = "text";
    btn.textContent = "Hide";
  } else {
    pwd.type = "password";
    btn.textContent = "Show";
  }
}
</script>

</body>
</html>
